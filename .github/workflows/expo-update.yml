name: OTA update

# Publishes the JavaScript bundle to EAS Update. Phones pick it up at next
# launch — seconds, instead of the fifteen minutes an APK takes.
#
# This is safe precisely because of `runtimeVersion: { policy: "fingerprint" }`
# in app.json. That derives the runtime from the actual native surface —
# dependencies, plugins, package id, SDK versions — so an update can only ever
# reach a binary built from the same native code. Change something native and
# the fingerprint changes, no installed phone matches, and nothing is delivered.
# The failure this prevents is the bad one: a JS bundle calling a native module
# the installed APK lacks, delivered to everyone at once, crashing on launch
# with no way back except a new APK.
#
# ── one-time setup, from your own machine ────────────────────────────────────
#
#   cd mobile
#   npx eas-cli login          # a free Expo account
#   npx eas-cli init           # writes extra.eas.projectId and updates.url
#   git add app.json && git commit -m "Configure EAS Update" && git push
#
# Then create a token at https://expo.dev/settings/access-tokens and add it as
# an EXPO_TOKEN secret under Settings → Secrets and variables → Actions.
#
# One APK build after that carries the updater; everything from then on is OTA.
#
# EAS *Update* is not EAS *Build* — the free build minutes that run out belong
# to Build, and updates do not touch them. APKs come from GitHub Actions here.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/src/**'
      - 'mobile/App.tsx'
      - 'mobile/assets/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch'
        type: string
        default: preview

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  update:
    name: Publish OTA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # After the checkout, because every `run:` here starts in mobile/.
      # Skipped rather than failed when unconfigured: this workflow fires on
      # every push to src/, and a red X on every commit until someone runs
      # `eas init` trains people to ignore the X.
      - name: Is OTA configured?
        id: gate
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          url="$(node -p "require('./app.json').expo.updates?.url ?? ''")"
          if [ -z "$url" ]; then
            echo "::notice::No updates.url in app.json — run 'npx eas-cli init' once. Skipping."
            echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ -z "$EXPO_TOKEN" ]; then
            echo "::warning::updates.url is set but EXPO_TOKEN is not. Add it under Settings → Secrets and variables → Actions."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.go == 'yes'
        run: npm ci

      # An OTA reaches phones in seconds and cannot be recalled, so the same
      # gates the APK build runs apply here — more so, not less.
      - name: Typecheck
        if: steps.gate.outputs.go == 'yes'
        run: npx tsc --noEmit

      - name: Test the game engines
        if: steps.gate.outputs.go == 'yes'
        run: npm test

      - name: Publish
        id: publish
        if: steps.gate.outputs.go == 'yes'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          npx eas-cli@latest update \
            --branch "${{ inputs.branch || 'preview' }}" \
            --message "$(git log -1 --pretty=%s)" \
            --non-interactive --json > update.json
          group="$(node -p 'JSON.parse(require("fs").readFileSync("update.json","utf8"))[0].group')"
          runtime="$(node -p 'JSON.parse(require("fs").readFileSync("update.json","utf8"))[0].runtimeVersion')"
          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

      - name: Summarise
        if: steps.gate.outputs.go == 'yes'
        run: |
          {
            echo "### OTA published"
            echo ""
            echo "Runtime \`${{ steps.publish.outputs.runtime }}\` · group \`${{ steps.publish.outputs.group }}\`"
            echo ""
            echo "Phones running an APK built from this same runtime pick it up at next"
            echo "launch. One built from a different native surface will not see it, which"
            echo "is the point — it would crash if it did."
          } >> "$GITHUB_STEP_SUMMARY"
